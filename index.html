<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Score Easy</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: oklch(0.9782 0.0039 145.5458);
        color: oklch(0 0 0);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      /* Static mirror of the React AppLoading splash — one continuous loading screen. */
      .boot-shell {
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(env(safe-area-inset-top), 24px) 24px max(env(safe-area-inset-bottom), 24px);
        background: oklch(0.9782 0.0039 145.5458);
      }

      .boot-panel {
        width: min(100%, 320px);
        display: grid;
        gap: 18px;
      }

      .boot-brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .boot-board {
        display: grid;
        grid-template-columns: 1fr 1px 1fr;
        border: 1.5px solid oklch(0 0 0);
        background: oklch(0.9855 0.0026 145.5558);
        box-shadow: 3px 3px 0px 0.5px hsl(0 0% 0% / 0.70), 3px 1px 2px -0.5px hsl(0 0% 0% / 0.70);
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      .boot-team {
        min-height: 118px;
        display: grid;
        place-items: center;
        gap: 8px;
        padding: 18px;
      }

      .boot-team span {
        font-size: 0.625rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: oklch(0.5103 0 0);
      }

      .boot-team strong {
        font-size: 3.25rem;
        line-height: 1;
        font-weight: 900;
        animation: boot-score-pulse 1.4s ease-in-out infinite;
      }

      .boot-team:last-child strong {
        animation-delay: 0.25s;
      }

      .boot-divider {
        background: oklch(0 0 0);
      }

      .boot-progress {
        height: 6px;
        overflow: hidden;
        border: 1px solid oklch(0 0 0);
        background: oklch(0.9855 0.0026 145.5558);
      }

      .boot-progress span {
        display: block;
        width: 42%;
        height: 100%;
        background: oklch(0.6230 0.1688 149.1777);
        animation: boot-loading-slide 1.1s ease-in-out infinite;
      }

      .boot-status {
        margin: 0;
        color: oklch(0.3211 0 0);
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-align: center;
        text-transform: uppercase;
      }

      @keyframes boot-score-pulse {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-4px);
        }
      }

      @keyframes boot-loading-slide {
        0% {
          transform: translateX(-110%);
        }

        100% {
          transform: translateX(250%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-team strong,
        .boot-progress span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <output class="boot-shell" aria-live="polite">
        <div class="boot-panel">
          <div class="boot-brand">
            <span>Score</span>
            <span>Easy</span>
          </div>
          <div class="boot-board" aria-hidden="true">
            <div class="boot-team">
              <span>Home</span>
              <strong>08</strong>
            </div>
            <div class="boot-divider"></div>
            <div class="boot-team">
              <span>Away</span>
              <strong>07</strong>
            </div>
          </div>
          <div class="boot-progress" aria-hidden="true"><span></span></div>
          <p class="boot-status">Preparing scoreboards</p>
        </div>
      </output>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
