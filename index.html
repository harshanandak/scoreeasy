<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Score Easy: Free Live Scoreboard App for Local Matches</title>
    <meta name="description" content="Score cricket, kabaddi, volleyball, badminton, football, basketball, tennis, table tennis and hockey on your phone. No account needed. Works offline." />
    <link rel="canonical" href="https://scoreeasy.app/" />
    <meta property="og:url" content="https://scoreeasy.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Score Easy" />
    <meta property="og:title" content="Score Easy: Free Live Scoreboard App for Local Matches" />
    <meta property="og:description" content="Score cricket, kabaddi, volleyball, badminton, football, basketball, tennis, table tennis and hockey on your phone. No account needed. Works offline." />
    <meta property="og:image" content="https://scoreeasy.app/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Score Easy app icon" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Score Easy: Free Live Scoreboard App for Local Matches" />
    <meta name="twitter:description" content="Score cricket, kabaddi, volleyball, badminton, football, basketball, tennis, table tennis and hockey on your phone. No account needed. Works offline." />
    <meta name="twitter:image" content="https://scoreeasy.app/icons/icon-512.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Score Easy",
        "description": "Score cricket, kabaddi, volleyball, badminton, football, basketball, tennis, table tennis and hockey on your phone. No account needed. Works offline.",
        "url": "https://scoreeasy.app/",
        "applicationCategory": "SportsApplication",
        "operatingSystem": "Web",
        "image": "https://scoreeasy.app/icons/icon-512.png",
        "isAccessibleForFree": true
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Do I need an account to score a match?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Pick a sport, tap Start and score. Your matches save on your phone. Sign in only if you want matches saved to your account or a live share link."
            }
          },
          {
            "@type": "Question",
            "name": "Does Score Easy work offline?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Scoring runs on your phone and saves every point there first, so a weak signal does not lose one. Saving to your account and live sharing need a connection."
            }
          },
          {
            "@type": "Question",
            "name": "Can friends follow the score live?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Sign in, go live on a match and send the link. Friends open the link to follow the score. A match stays private until you share it."
            }
          },
          {
            "@type": "Question",
            "name": "Is Score Easy free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Scoring, tournaments and an account are free."
            }
          }
        ]
      }
    </script>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #f6f8f6;
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-shell {
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(env(safe-area-inset-top), 24px) 24px max(env(safe-area-inset-bottom), 24px);
        background: #f6f8f6;
      }

      .boot-card {
        width: min(100%, 320px);
        border: 1px solid #111111;
        border-radius: 8px;
        background: #ffffff;
        padding: 20px;
        box-shadow: 3px 3px 0 #111111;
      }

      .boot-brand {
        display: inline-flex;
        flex-direction: column;
        gap: 2px;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 13px;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .boot-scoreboard {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 12px;
        margin-top: 18px;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      .boot-team {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .boot-team:last-child {
        text-align: right;
      }

      .boot-team span {
        color: #666666;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .boot-team strong {
        font-size: 28px;
        line-height: 1;
      }

      .boot-divider {
        width: 1px;
        height: 44px;
        background: #d7ddd7;
      }

      .boot-progress {
        height: 4px;
        margin-top: 18px;
        overflow: hidden;
        border-radius: 999px;
        background: #e4e8e4;
      }

      .boot-progress span {
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: #16a34a;
        animation: boot-progress 1.1s ease-in-out infinite alternate;
      }

      .boot-status {
        margin: 12px 0 0;
        color: #555555;
        font-size: 14px;
      }

      @keyframes boot-progress {
        from {
          transform: translateX(-15%);
        }

        to {
          transform: translateX(140%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <output class="boot-shell" aria-live="polite">
        <div class="boot-card">
          <div class="boot-brand">
            <span>Score</span>
            <span>Easy</span>
          </div>
          <div class="boot-scoreboard" aria-hidden="true">
            <div class="boot-team">
              <span>Home</span>
              <strong>08</strong>
            </div>
            <div class="boot-divider"></div>
            <div class="boot-team">
              <span>Away</span>
              <strong>07</strong>
            </div>
          </div>
          <div class="boot-progress" aria-hidden="true"><span></span></div>
          <p class="boot-status">Loading Score Easy</p>
        </div>
      </output>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
