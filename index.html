<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Score Easy</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #f6f8f6;
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-shell {
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(env(safe-area-inset-top), 24px) 24px max(env(safe-area-inset-bottom), 24px);
        background: #f6f8f6;
      }

      .boot-card {
        width: min(100%, 320px);
        border: 1px solid #111111;
        border-radius: 8px;
        background: #ffffff;
        padding: 20px;
        box-shadow: 3px 3px 0 #111111;
      }

      .boot-brand {
        display: inline-flex;
        flex-direction: column;
        gap: 2px;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 13px;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .boot-scoreboard {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 12px;
        margin-top: 18px;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      .boot-team {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .boot-team:last-child {
        text-align: right;
      }

      .boot-team span {
        color: #666666;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .boot-team strong {
        font-size: 28px;
        line-height: 1;
      }

      .boot-divider {
        width: 1px;
        height: 44px;
        background: #d7ddd7;
      }

      .boot-progress {
        height: 4px;
        margin-top: 18px;
        overflow: hidden;
        border-radius: 999px;
        background: #e4e8e4;
      }

      .boot-progress span {
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: #16a34a;
        animation: boot-progress 1.1s ease-in-out infinite alternate;
      }

      .boot-status {
        margin: 12px 0 0;
        color: #555555;
        font-size: 14px;
      }

      @keyframes boot-progress {
        from {
          transform: translateX(-15%);
        }

        to {
          transform: translateX(140%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <output class="boot-shell" aria-live="polite">
        <div class="boot-card">
          <div class="boot-brand">
            <span>Score</span>
            <span>Easy</span>
          </div>
          <div class="boot-scoreboard" aria-hidden="true">
            <div class="boot-team">
              <span>Home</span>
              <strong>08</strong>
            </div>
            <div class="boot-divider"></div>
            <div class="boot-team">
              <span>Away</span>
              <strong>07</strong>
            </div>
          </div>
          <div class="boot-progress" aria-hidden="true"><span></span></div>
          <p class="boot-status">Loading Score Easy</p>
        </div>
      </output>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
