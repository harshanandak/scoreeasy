pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: bun run lint
    - name: type-check
      run: bun run type-check
    - name: agent-config-sync
      run: bun run sync:agents -- --check

pre-push:
  parallel: false
  jobs:
    - name: related-tests
      # Docs/config-only changes can have no related tests; Git errors still fail.
      run: git merge-base HEAD origin/master > /dev/null && bun run test --changed origin/master --passWithNoTests
