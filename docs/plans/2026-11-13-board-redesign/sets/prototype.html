.kit-setup-title {
  flex: 1;
  min-width: 0;
}

.kit-setup-title h1 {
  margin: 0;
  /* Shrink with the viewport and wrap only between words: "Basketball" must never split to
     "Basketba / ll" on a 360 px phone with a wide fallback font. */
  font-family: var(--se-font-display);
  font-size: clamp(1.05rem, 5vw, 1.3rem);
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -0.02em;
  overflow-wrap: normal;
  word-break: normal;
  hyphens: none;
}

.kit-setup-title p {
  margin: 3px 0 0;
  color: var(--se-color-ink-soft);
  font-size: 0.82rem;
  font-weight: 600;
}

/* A quiet text action ("Tournament", "Edit rules", "Add players"): 48px for the thumb. */
.kit-setup-link {
  display: inline-flex;
  flex: none;
  align-items: center;
  min-height: 48px;
  padding: 0 6px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--se-color-ink);
  font: 750 0.9rem var(--se-font-sans);
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 4px;
  cursor: pointer;
}

/* ---- fields ---- */
.kit-setup-field {
  position: relative;
  margin-top: 16px;
}

.kit-setup-label {
  display: block;
  margin: 0 2px 8px;
  color: var(--se-color-ink-soft);
  font: 700 0.85rem/1.2 var(--se-font-sans);
}

.kit-setup-input {
  display: block;
  box-sizing: border-box;
  width: 100%;
  min-height: 52px;
  padding: 0 16px;
  border: 0;
  border-radius: 14px;
  background: var(--se-color-surface);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--se-color-ink) 16%, transparent);
  color: var(--se-color-ink);
  font: 650 1.04rem var(--se-font-sans);
}

.kit-setup-input::placeholder {
  color: var(--se-color-ink-muted);
}

/* Saved-team suggestions under a name field. */
.kit-setup-suggest {
  position: absolute;
  z-index: 10;
  right: 0;
  left: 0;
  max-height: 180px;
  margin-top: 4px;
  overflow-y: auto;
  border-radius: 14px;
  background: var(--se-color-surface);
  box-shadow: inset 0 0 0 1px var(--se-color-line-soft), var(--se-lift);
}

.kit-setup-suggest p {
  margin: 0;
  padding: 12px 14px;
  color: var(--se-color-ink-muted);
  font-size: 0.875rem;
}

.kit-setup-suggest button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-height: 48px;
  padding: 0 14px;
  border: 0;
  background: transparent;
  color: var(--se-color-ink);
  font: 600 0.9rem var(--se-font-sans);
  text-align: left;
  cursor: pointer;
}

.kit-setup-suggest button + button {
  border-top: 1px solid var(--se-color-line-soft);
}

.kit-setup-suggest small {
  color: var(--se-color-ink-muted);
  font-size: 0.78rem;
}

/* ---- stepper (the segmented control lives in kit.css, shared with History) ---- */
.kit-stepper {
  display: flex;
  align-items: center;
  gap: 14px;
}

.kit-stepper .se-ctl {
  width: 48px;
  padding: 0;
  font-size: 1.3rem;
}

.kit-stepper output {
  min-width: 40px;
  font: 800 1.9rem/1 var(--se-font-num);
  font-variant-numeric: tabular-nums;
  text-align: center;
}

.kit-setup-rules {
  margin: 10px 2px 0;
  color: var(--se-color-ink-soft);
  font-size: 0.875rem;
  font-weight: 500;
  line-height: 1.4;
}

.kit-setup-rules-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.kit-setup-hint {
  margin: 6px 2px 0;
  color: var(--se-color-ink-muted);
  font-size: 0.82rem;
}

.kit-setup-check {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 48px;
  margin-top: 8px;
  color: var(--se-color-ink);
  font-weight: 600;
  cursor: pointer;
}

.kit-setup-check input {
  width: 22px;
  height: 22px;
  accent-color: var(--se-color-ink);
}

.kit-setup-roster {
  display: grid;
  gap: 16px;
  margin-top: 4px;
  padding: 14px;
  border-radius: 16px;
  background: var(--se-color-surface);
  box-shadow: inset 0 0 0 1px var(--se-color-line-soft);
}

.kit-setup-roster h3 {
  margin: 0 0 8px;
  color: var(--se-color-ink-soft);
  font-size: 0.82rem;
  font-weight: 700;
}

/* Fixed within the same 672px column on every sport and every step. */
.kit-screen > .kit-setup-cta {
  position: fixed;
  z-index: 5;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  box-sizing: border-box;
  width: 100%;
  max-width: 672px;
  padding: 14px 16px calc(16px + var(--se-safe-bottom, env(safe-area-inset-bottom, 0px)));
  background: var(--se-color-canvas);
  box-shadow: 0 -1px 0 var(--se-color-line-soft);
}

.kit-setup-cta .se-go {
  width: 100%;
  min-height: 52px;
}

html:has(.kit-setup) {
  scroll-padding-bottom: calc(140px + var(--se-safe-bottom, env(safe-area-inset-bottom, 0px)));
}

/* Missing a name: still focusable and announced (aria-disabled + the hint), but it no longer
   reads as the Go. */
.kit-setup-cta .se-go[aria-disabled='true'] {
  border-style: dashed;
  background: var(--se-color-surface-warm);
  box-shadow: none;
  color: var(--se-color-ink-soft);
}

.kit-setup-cta .kit-setup-hint {
  position: absolute;
  right: 16px;
  bottom: 100%;
  left: 16px;
  margin: 0;
  padding: 8px;
  background: var(--se-color-canvas);
  text-align: center;
}

/* ---- the rules editor ---- */
.kit-rules-group {
  margin-top: 18px;
}

.kit-rules-group .kit-setup-hint {
  margin-top: 8px;
}

.kit-rules-custom {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
}

.kit-rules-custom .kit-setup-input {
  width: 96px;
  text-align: center;
}

.kit-rules-done {
  width: 100%;
  margin-top: 24px;

const opp = (t) => (t === 'A' ? 'B' : 'A');

  const R = RULES[st.sport], t = targetOf(st), hi = Math.max(a, b), lo = Math.min(a, b);
  if (R.cap && hi >= R.cap) return a > b ? 'A' : 'B';
  if (hi >= t && hi - lo >= R.winBy) return a > b ? 'A' : 'B';

}

    case 'pt': {
      if (ev.who === 'A') st.a++; else st.b++;
      st.pts.push(ev.who); st.all.push(ev.who); st.last = ev.who;
      const w = winnerOf(st, st.a, st.b);
      if (w) {

        if (st.wins[w] === st.toWin) { st.phase = 'over'; st.winner = w; }
        else { const nf = R.nextFirst(st, w); st.phase = 'between'; st.between = { swap: null, srv: nf.srv, fixed: nf.fixed, why: nf.why, winner: w }; }

        const p = R.mid(st);

      break;
    }
    case 'swap': if (ev.swap) st.left = opp(st.left); st.phase = 'play'; st.prompt = null; break;
    case 'resume': st.phase = 'play'; st.prompt = null; break;
    case 'side': st.between.swap = ev.swap; break;
    case 'srv': st.between.srv = ev.who; break;
    case 'start':
      if (st.between.swap) st.left = opp(st.left);
      st.g++; st.first = st.between.srv; st.a = 0; st.b = 0; st.pts = []; st.fired = {}; st.last = null;
      st.between = null; st.phase = 'play'; break;
    default: break;

function replay(sport, bo, events) { return events.reduce(reduce, newMatch(sport, bo)); }

// Is this event legal right now? The UI only ever dispatches legal events.
function valid(st, ev) {
  switch (ev.k) {
    case 'first': return st.phase === 'first';
    case 'pt': return st.phase === 'play';
    case 'swap': return st.phase === 'change';
    case 'resume': return st.phase === 'interval';
    case 'side': return st.phase === 'between' && st.between.swap !== ev.swap;
    case 'srv': return st.phase === 'between' && !st.between.fixed && st.between.srv !== ev.who;
    case 'start': return st.phase === 'between' && st.between.swap !== null && !!st.between.srv;
    default: return false;
  }
}

// Does t win the game if it scores next? (set point / game point / sudden point)
const wouldWin = (st, t) => winnerOf(st, st.a + (t === 'A' ? 1 : 0), st.b + (t === 'B' ? 1 : 0)) === t;

function flagOf(st) {
  if (!['play', 'change', 'interval'].includes(st.phase)) return null;
  const R = RULES[st.sport], ca = wouldWin(st, 'A'), cb = wouldWin(st, 'B');
  if (ca && cb) return { text: 'SUDDEN POINT', team: null, tone: 'gold' };
  const t = ca ? 'A' : cb ? 'B' : null;
  if (t) return { text: st.wins[t] + 1 === st.toWin ? 'MATCH POINT' : `${R.unit.toUpperCase()} POINT`, team: t, tone: 'gold' };
  if (st.a === st.b && st.a >= targetOf(st) - 1) return { text: 'DEUCE', team: null, tone: 'ink' };
  return null;
}

// What tapping t really does: shown under "+1". Empty when nothing needs saying.
function nextHint(st, t) {
  const R = RULES[st.sport], a = st.a + (t === 'A' ? 1 : 0), b = st.b + (t === 'B' ? 1 : 0);
  const mine = t === 'A' ? a : b, theirs = t === 'A' ? b : a;
  if (winnerOf(st, a, b) === t) return st.wins[t] + 1 === st.toWin ? 'wins the match' : `wins the ${R.unit.toLowerCase()}`;
  const f = flagOf({ ...st, a, b, phase: 'play' });
  if (!f) return '';
  if (f.text === 'DEUCE') return `${mine}–${theirs} deuce`;
  if (f.team === t) return `${mine}–${theirs} ${f.text.toLowerCase()}`;
  if (f.team === null) return `${mine}–${theirs} ${f.text.toLowerCase()}`;
  return '';
}

const leftScore = (st) => (st.left === 'A' ? [st.a, st.b] : [st.b, st.a]);

}

function rng(seed) { let x = seed >>> 0; return () => { x = (Math.imul(x, 1664525) + 1013904223) >>> 0; return x / 4294967296; }; }
// Play points from the current game score to (a, b) in a random but legal order.
// The last point goes to lastWho. Prompts that open on the way are answered (swap) unless it is the last point.
function fill(st, a, b, lastWho, seed) {
  const needA = a - st.a, needB = b - st.b;
  for (let tr = 0; tr < 400; tr++) {
    const r = rng(seed * 977 + tr), pool = [...'A'.repeat(needA), ...'B'.repeat(needB)];
    const li = pool.lastIndexOf(lastWho); if (li < 0) return null; pool.splice(li, 1);
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    pool.push(lastWho);
    let s = st, ok = true;
    for (let i = 0; i < pool.length && ok; i++) {
      if (s.phase !== 'play') { ok = false; break; }
      s = reduce(s, { k: 'pt', who: pool[i] });
      const last = i === pool.length - 1;
      if (!last && s.phase === 'change') s = reduce(s, { k: 'swap', swap: true });
      else if (!last && s.phase === 'interval') s = reduce(s, { k: 'resume' });
      else if (!last && s.phase !== 'play') ok = false;
    }
    if (ok && s.a === a && s.b === b) return s;

}

const phaseDocked = (st) => st.phase === 'first' || ['change', 'interval', 'between', 'over'].includes(st.phase);
const isPick = (st) => st.phase === 'first' || (st.phase === 'between' && !st.between.fixed);

// "back to 24-22": the score Undo restores, in the board's left to right order (DESIGN.md)
function undoHint(st) {
  if (!st.ev.length) return '';
  const e = st.ev[st.ev.length - 1], L = st.left;
  if (e.k === 'pt') {
    let a, b;
    if (st.phase === 'between' || st.phase === 'over') { const g = st.games[st.games.length - 1]; a = g[0]; b = g[1]; }
    else { a = st.a; b = st.b; }
    if (e.who === 'A') a--; else b--;
    return `back to ${L === 'A' ? a : b}${N}${L === 'A' ? b : a}`;
  }
  return { swap: 'back to the end change', resume: 'back to the interval', side: 'back to the break', srv: 'back to the break', start: 'back to the break', first: 'back to the toss' }[e.k] || 'back one step';
}

function flagText(st) { const f = flagOf(st); return f ? sentence(f.text) : ''; }

function metaItems(st, o) {
  const R = RULES[st.sport], L = st.left, Rr = opp(L);
  if (st.phase === 'first') return ['New match'];
  return o.dir === 'a' ? [`${R.unit} ${st.g + 1}`, `To ${targetOf(st)}`] : [`${R.unit} ${st.g + 1}`, `${R.unit}s ${st.wins[L]}${N}${st.wins[Rr]}`];
}

function setsRow(st) {
  if (!st.games.length) return '';
  const L = st.left, R = RULES[st.sport];
  return `<div class="tsb-sets kd-sets" aria-label="Completed ${R.unit.toLowerCase()}s">${st.games.map(([a, b], i) => {
    const w = a > b ? 'A' : 'B';
    return `<span class="tsb-set tsb-win-${w.toLowerCase()}"><b>${L === 'A' ? a : b}${N}${L === 'A' ? b : a}</b><span class="sr-only">, ${R.unit.toLowerCase()} ${i + 1}, ${esc(nameOf(st, w))} won</span></span>`;
  }).join('')}</div>`;
}

function lastLine(st, o) {
  if (o.note) return esc(o.note);
  if (st.phase === 'first') return 'Tap the team that serves first';
  if (st.phase === 'over') return 'Match over';
  if (st.phase !== 'play') return 'Play is paused';
  const e = st.ev[st.ev.length - 1];
  if (e && e.k === 'pt') { const [l, r] = st.left === 'A' ? [st.a, st.b] : [st.b, st.a]; return `${sw(e.who)}Last point ${l}${N}${r}`; }
  return 'Tap a team to score a point';
}

// the one serve cue: text for the serving tag, or null. Between sets it marks the next first server.
function serveTag(st, t) {
  const R = RULES[st.sport];
  if (st.phase === 'first' || st.phase === 'over') return null;
  if (st.phase === 'between') {
    const b = st.between; if (b.srv !== t) return null;
    const sv = R.serve({ ...st, a: 0, b: 0, last: null, first: t });
    return 'Serves first' + (sv.sub ? ' · ' + sv.sub.toLowerCase() : '');
  }
  const sv = R.serve(st); if (sv.who !== t) return null;
  return 'Serving' + (sv.sub ? ' · ' + sv.sub.toLowerCase() : '');
}

function tapWord(st, t) {
  const h = nextHint(st, t);
  return h.startsWith('wins') ? `Tap +1 · ${h}` : 'Tap +1';
}

/* ---- the bar and header (shipped BoardHeader / BoardBar markup) ---- */
function header(st, o, finish = true) {
  const R = RULES[st.sport];
  const sub = st.phase === 'first' ? 'Pick the format and the first server' : `Best of ${st.bo} · to ${targetOf(st)}${R.cap ? ` · cap ${R.cap}` : `, win by ${R.winBy}`}`;
  return `<header class="sb-top"><div class="sb-title"><b>${esc(R.title)}</b><small>${esc(sub)}</small></div>${o.live ? '<span class="sb-live">Live</span>' : o.ended ? '<span class="kit-live-paused">Match over</span>' : ''}${finish ? `<button type="button" class="se-ctl sb-finish" data-act="finish"${st.phase === 'over' ? ' disabled' : ''}>Finish</button>` : ''}</header>`;
}

function bar(st, o) {
  const u = undoHint(st), R = RULES[st.sport];
  const letB = R.hasLet && st.phase === 'play' ? '<button type="button" class="se-ctl kd-let" data-act="let">Let</button>' : '';
  return `<div class="sb-bar${letB ? ' kd-bar-let' : ''}"><button type="button" class="se-ctl sb-undo" data-act="undo"${u ? '' : ' disabled'} aria-label="Undo last action">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-2"/></svg>
    <span class="sb-undo-t">Undo</span><span class="sb-undo-w">${u ? esc(u) : 'Nothing to undo'}</span></button>${letB}
    <button type="button" class="se-ctl sb-more" data-act="more" aria-label="Match options" aria-haspopup="dialog"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg></button></div>`;
}

/* ---- the two keys. B: whole halves, names on the keys. A: pads only, names live on the board ---- */
function keyAttrs(st, t) {
  const ph = st.phase;
  if (ph === 'play') return { act: `data-act="pt" data-who="${t}"`, word: tapWord(st, t), on: true };
  if (ph === 'first') return { act: `data-act="first" data-who="${t}"`, word: 'Tap to serve first', on: true };
  if (ph === 'between' && !st.between.fixed) return { act: `data-act="srv" data-who="${t}"`, word: st.between.srv === t ? 'Selected' : 'Tap to serve first', on: true };
  return { act: '', word: ph === 'over' ? `${RULES[st.sport].unit.toLowerCase()}s won` : '', on: false };
}

function keyB(st, t, i) {
  const k = t.toLowerCase(), a = keyAttrs(st, t), tag = serveTag(st, t);
  const won = st.phase === 'over' && st.winner === t;
  const n = st.phase === 'over' ? st.wins[t] : t === 'A' ? st.a : st.b;
  const label = st.phase === 'play' ? `Add point for ${nameOf(st, t)}` : a.on ? `${nameOf(st, t)} serves first` : nameOf(st, t);
  return `<button type="button" class="tsb-key tsb-key-${k}" data-team="${k}" data-side="${i === 0 ? 'left' : 'right'}" ${a.act}${a.on ? '' : ' disabled'} aria-label="${esc(label)}">
    ${tag ? '<span class="tsb-mark" aria-hidden="true"></span>' : ''}${tag ? `<span class="tsb-srv">${esc(tag)}</span>` : won ? '<span class="tsb-srv">Winner</span>' : ''}<span class="tsb-who">${esc(nameOf(st, t))}</span><span class="tsb-big">${n}</span><span class="tsb-word">${esc(a.word)}</span></button>`;
}

function padA(st, t, i) {
  const k = t.toLowerCase(), a = keyAttrs(st, t), tag = serveTag(st, t);
  return `<button type="button" class="tsb-key tsb-key-${k} kd-pad" data-team="${k}" data-side="${i === 0 ? 'left' : 'right'}" ${a.act}${a.on ? '' : ' disabled'} aria-label="${esc(st.phase === 'play' ? `Add point for ${nameOf(st, t)}` : `${nameOf(st, t)} serves first`)}">
    ${tag ? '<span class="tsb-mark" aria-hidden="true"></span>' : ''}${tag ? `<span class="tsb-srv">${esc(tag)}</span>` : ''}<span class="tsb-big${st.phase === 'first' ? ' kd-text' : ''}">${st.phase === 'first' ? 'Serve first' : '+1'}</span><span class="tsb-word">${esc(st.phase === 'first' ? 'Tap to choose' : a.word.replace(/^Tap \+1( · )?/, ''))}</span></button>`;
}

function boardA(st) {
  const R = RULES[st.sport], L = st.left, Rr = opp(L), pick = st.phase === 'between' && !st.between.fixed;
  const col = (t) => {
    const n = st.phase === 'over' ? st.wins[t] : t === 'A' ? st.a : st.b;
    let chip = '';
    if (st.phase === 'over' && st.winner === t) chip = '<span class="kit-chip">Winner</span>';
    else if (st.phase === 'between' || st.phase === 'change' || st.phase === 'interval') {
      // the pads are hidden while play is paused, so the board keeps the one serve chip
      const tg = serveTag(st, t);
      if (tg) chip = `<span class="kit-chip">${markSvg(st.sport)}${esc(tg)}</span>`;
      else if (pick) chip = '<span class="kit-chip">Tap to serve first</span>';
    }
    const wins = st.wins[t];
    const attrs = pick ? ` role="button" tabindex="0" data-act="srv" data-who="${t}" aria-label="${esc(nameOf(st, t))} serves first"` : '';
    return `<div class="kd-col${pick ? ' is-pick' : ''}"${attrs}><span class="kd-colhead">${sw(t)}<span class="tsb-who">${esc(nameOf(st, t))}</span></span>
      <span class="tsb-big">${n}</span><span class="tsb-word">${wins} ${R.unit.toLowerCase()}${wins === 1 ? '' : 's'} won</span>${chip ? `<span class="kd-colchip">${chip}</span>` : ''}</div>`;
  };
  return `<section class="sb-sheet-group kd-board" aria-label="Score">${col(L)}${col(Rr)}</section>`;
}

/* ---- the docked sheet: the shipped options-sheet skin, sitting above the bar while play is paused ---- */
function dock(st, o) {
  const R = RULES[st.sport], u = R.unit.toLowerCase();
  if (st.phase === 'first') {
    return `<div class="sb-sheet kd-dock" role="region" aria-label="New match"><div class="sb-sheet-head"><b>New match</b></div>
      <p class="kit-sub">Format</p>
      <div class="kit-seg" style="--kit-seg-cols:2" role="group" aria-label="Format"><button type="button" data-act="bo" data-v="3" aria-pressed="${st.bo === 3}">Best of 3</button><button type="button" data-act="bo" data-v="5" aria-pressed="${st.bo === 5}">Best of 5</button></div>
      <p class="sb-sheet-note kd-note">${esc(R.ruleLine)} ${esc(R.setupNote)}</p></div>`;
  }
  if (st.phase === 'change' || st.phase === 'interval') {
    const p = st.prompt, cd = o.cd != null ? o.cd : p.interval;
    const chip = p.interval ? `<span class="kit-chip"><span data-cd>${cd}</span>&nbsp;seconds</span>` : '';
    if (st.phase === 'interval') {
      return `<div class="sb-sheet kd-dock" role="region" aria-label="${esc(p.title)}"><div class="sb-sheet-head"><b>${esc(p.title)}</b>${chip}</div>
        <p class="sb-sheet-note kd-note">${esc(p.detail)} Play starts when you tap.</p>
        <button type="button" class="se-go" data-act="resume">Back to play</button></div>`;
    }
    return `<div class="sb-sheet kd-dock" role="region" aria-label="${esc(p.title)}"><div class="sb-sheet-head"><b>${esc(p.title)}</b>${chip}</div>
      <p class="sb-sheet-note kd-note">${esc(p.detail)}</p>
      <div class="kd-pair"><button type="button" class="se-go" data-act="swap" data-v="1">Flip the&nbsp;screen</button><button type="button" class="se-ctl" data-act="swap" data-v="0">Keep the screen as&nbsp;is</button></div>
      <p class="sb-sheet-note kd-note">${KEEP_NOTE}</p></div>`;
  }
  if (st.phase === 'between') {
    const b = st.between, g0 = st.games[st.games.length - 1], gm = b.winner === 'A' ? g0 : [g0[1], g0[0]];
    const ready = b.swap !== null && !!b.srv, next = st.g + 2;
    const label = ready ? `Start ${u} ${next}` : b.swap === null && !b.srv ? 'Choose both to start' : b.swap === null ? 'Flip or keep the screen to start' : 'Pick who serves first';
    return `<div class="sb-sheet kd-dock" role="region" aria-label="Between ${u}s"><div class="sb-sheet-head"><b>${sw(b.winner)}won&nbsp;${gm[0]}${N}${gm[1]}</b></div>
      <p class="kit-sub">Teams change ends for ${u} ${next}</p>
      <div class="kit-seg" style="--kit-seg-cols:2" role="group" aria-label="Screen"><button type="button" data-act="side" data-v="1" aria-pressed="${b.swap === true}">Flip the&nbsp;screen</button><button type="button" data-act="side" data-v="0" aria-pressed="${b.swap === false}">Keep the screen as&nbsp;is</button></div>
      <p class="sb-sheet-note kd-note">${KEEP_NOTE} ${esc(b.why)}.</p>
      <div class="kit-setup-cta kd-cta"><button type="button" class="se-go" data-act="start" aria-disabled="${ready ? 'false' : 'true'}">${esc(label)}</button></div></div>`;
  }
  // over
  return `<div class="sb-sheet kd-dock" role="region" aria-label="Match over"><div class="sb-sheet-head"><b>Match over</b></div>
    <button type="button" class="se-go" data-act="new">New match</button>
    <p class="sb-sheet-note kd-note">Undo, below, takes the winning point back.</p></div>`;
}

/* ---- the options sheet (More) and the Finish check: the shipped sheet layer ---- */
function overlay(st, o) {
  if (!o.sheet) return '';
  let body;
  if (o.sheet === 'finish') {
    const L = st.left, [l, r] = L === 'A' ? [st.a, st.b] : [st.b, st.a];
    body = `<div class="sb-sheet-head"><b>Finish this match?</b></div>
      <div class="sb-confirm-summary"><span>${esc(metaItems(st, { dir: 'b' }).join(' · '))}</span><strong>${l}${N}${r}</strong></div>
      <button type="button" class="se-go" data-act="finishgo">Finish match</button>
      <p class="sb-sheet-note kd-note"><button type="button" class="se-ctl kd-wide" data-act="closesheet">Keep scoring</button></p>`;
  } else {
    body = `<div class="sb-sheet-head"><b>Match options</b><button type="button" class="se-ctl sb-sheet-close" data-act="closesheet">Done</button></div>
      <div class="sb-sheet-group"><button type="button" class="sb-row" disabled>Swap sides</button><button type="button" class="sb-row" disabled><span>Correct a score</span><span class="sb-row-aside">${'−'}1</span></button></div>
      <p class="sb-sheet-note kd-note">Swap sides and score corrections work as on today's board. This prototype leaves them out.</p>
      <div class="sb-sheet-group"><button type="button" class="sb-row sb-row-danger" data-act="new">Discard match</button></div>`;
  }
  return `<div class="sb-sheet-layer"><button type="button" class="sb-scrim" data-act="closesheet" aria-label="Close" tabindex="-1"></button><div class="sb-sheet" role="dialog" aria-modal="true" aria-label="Match options">${body}</div></div>`;
}

/* ---- scorer: B Court and A Board over pads ---- */
function scorer(st, o) {
  const docked = phaseDocked(st), dir = o.dir === 'a' ? 'a' : 'b';
  const f = flagText(st);
  const meta = metaItems(st, o).map((m) => `<span class="tsb-meta-item">${esc(m)}</span>`).join('') + (f ? `<span class="tsb-point-cue" role="status">${esc(f)}</span>` : '');
  const L = st.left, Rr = opp(L);
  let surface;
  if (dir === 'b') surface = `<div class="tsb-keys">${keyB(st, L, 0)}${keyB(st, Rr, 1)}</div>`;
  else {
    const pads = st.phase === 'play' || st.phase === 'first';
    surface = boardA(st) + (pads ? `<div class="tsb-keys kd-pads">${padA(st, L, 0)}${padA(st, Rr, 1)}</div>` : '');
  }
  return `<div class="sb tsb kd kd-${dir}${docked ? ' kd-docked' : ''}" style="${teamStyle(st, o)}" data-team-board="" data-phase="${st.phase}" data-sport="${st.sport}">
    ${header(st, o)}
    <p class="tsb-meta">${meta}</p>
    ${setsRow(st)}
    <p class="tsb-last" aria-live="polite">${lastLine(st, o)}</p>
    ${surface}
    ${docked ? dock(st, o) : ''}
    ${bar(st, o)}
    ${overlay(st, o)}</div>`;
}

/* ---- today's board, rebuilt from the shipped TeamSetsBoard markup, for the side by side ---- */
function today(st, o) {
  const R = RULES[st.sport], L = st.left, Rr = opp(L);
  const sub = `${R.name} · ${targetOf(st)} pts · win by ${R.winBy}`;
  const f = flagText(st);
  const u = undoHint(st);
  const key = (t, i) => {
    const k = t.toLowerCase(), tag = st.phase === 'play' ? serveTag(st, t) : null;
    return `<button type="button" class="tsb-key tsb-key-${k}" data-team="${k}" data-side="${i === 0 ? 'left' : 'right'}" aria-label="Add point for ${esc(nameOf(st, t))}">${tag ? '<span class="tsb-mark" aria-hidden="true"></span><span class="tsb-srv">Serving</span>' : ''}<span class="tsb-who">${esc(nameOf(st, t))}</span><span class="tsb-big">${t === 'A' ? st.a : st.b}</span><span class="tsb-word">Tap +1</span></button>`;
  };
  const e = st.ev[st.ev.length - 1];
  const last = e && e.k === 'pt' ? `Last: point ${nameOf(st, e.who)} · ${L === 'A' ? st.a : st.b}${N}${L === 'A' ? st.b : st.a}` : 'Tap a team to score a point';
  return `<div class="sb tsb kd kd-today" style="${teamStyle(st, o)}" data-team-board="">
    <header class="sb-top"><div class="sb-title"><b>${esc(nameOf(st, 'A'))} v ${esc(nameOf(st, 'B'))}</b><small>${esc(sub)}</small></div><button type="button" class="se-ctl sb-finish">Finish</button></header>
    <p class="tsb-meta"><span class="tsb-meta-item">${R.unit} ${st.g + 1}</span><span class="tsb-meta-item">${R.unit}s ${st.wins[L]}${N}${st.wins[Rr]}</span>${f ? `<span class="tsb-point-cue" role="status">${esc(f)}</span>` : ''}</p>
    <p class="tsb-last">${esc(last)}</p>
    <div class="tsb-keys">${key(L, 0)}${key(Rr, 1)}</div>
    <div class="sb-bar"><button type="button" class="se-ctl sb-undo"${u ? '' : ' disabled'}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-2"/></svg><span class="sb-undo-t">Undo</span><span class="sb-undo-w">${u ? esc(u) : 'Nothing to undo'}</span></button><button type="button" class="se-ctl sb-more" aria-label="Match options"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg></button></div></div>`;
}

/* ---- live (spectator): built from the Kit live parts, no shipped spectator scorecard exists yet ---- */
function liveView(st, o) {
  const R = RULES[st.sport], k = st.games.length;
  const showNow = !['between', 'over', 'first'].includes(st.phase);
  const cols = `repeat(${k}, 34px)${showNow ? ' 52px' : ''}`;
  const chipFor = (t) => {
    if (st.phase === 'over') return st.winner === t ? '<span class="kit-chip">Winner</span>' : '';
    if (!['play', 'change', 'interval'].includes(st.phase)) return '';
    const sv = R.serve(st); if (sv.who !== t) return '';
    return `<span class="kit-chip">${markSvg(st.sport)}${sv.sub ? esc(sv.sub.toLowerCase()) : 'Serving'}</span>`;
  };
  const row = (t) => {
    const cells = st.games.map(([a, b]) => { const m = t === 'A' ? a : b, q = t === 'A' ? b : a; return `<span class="${m > q ? 'kit-live-team' : 'kit-live-sets'} kd-cell">${m}</span>`; }).join('');
    const now = showNow ? `<span class="kit-live-score kd-now">${t === 'A' ? st.a : st.b}</span>` : '';
    const chip = chipFor(t);
    return `<div class="kit-live-row kd-lrow"><span class="kit-live-team"><i class="kit-live-team-dot" style="background:var(--team-${t.toLowerCase()}-core)"></i><span class="kit-live-name">${esc(nameOf(st, t))}</span></span>
      <span class="kd-lnums" style="grid-template-columns:${cols}">${cells}${now}</span>
      <span class="kit-live-meta"><span>${st.wins[t]} ${R.unit.toLowerCase()}${st.wins[t] === 1 ? '' : 's'}</span>${chip}</span></div>`;
  };
  const hd = `<div class="kit-live-meta kd-lhead"><span>${R.unit} ${st.phase === 'over' ? st.games.length : st.g + 1}</span><span class="kd-lnums" style="grid-template-columns:${cols}">${st.games.map((_, i) => `<span>${i + 1}</span>`).join('')}${showNow ? '<span class="kd-nowlbl">Now</span>' : ''}</span></div>`;
  let foot = '';
  if (st.phase === 'first') foot = 'Match starts soon';
  else if (st.phase === 'between') foot = `Break. ${R.unit} ${st.g + 2} starts next`;
  const f = flagText(st);
  const paused = st.phase === 'change' ? 'End change' : st.phase === 'interval' ? 'Interval' : '';
  const footer = foot || f || paused ? `<div class="kit-live-meta kd-lfoot">${foot ? `<span>${esc(foot)}</span>` : ''}${paused ? `<span class="kit-live-paused">${paused}</span>` : ''}${f ? `<span class="tsb-point-cue">${esc(f)}</span>` : ''}</div>` : '';
  let recent;
  const last = st.all.slice(-12);
  if (!last.length) recent = '<p class="kit-sub">No points yet</p>';
  else {
    let n = 0; const lw = st.all[st.all.length - 1]; for (let i = st.all.length - 1; i >= 0 && st.all[i] === lw; i--) n++;
    recent = `<div class="kd-dots">${last.map((c) => `<span class="kit-step-num kd-dot" style="background:var(--team-${c.toLowerCase()}-core);color:var(--team-${c.toLowerCase()}-on)">${R.init[c === 'A' ? 0 : 1]}</span>`).join('')}</div>
      <p class="kd-run">${n >= 2 ? `${sw(lw)}${n} in a row` : 'Points trading'}</p>`;
  }
  return `<div class="sb tsb kd kd-live" style="${teamStyle(st, o)}" data-phase="${st.phase}" data-sport="${st.sport}">
    ${header(st, { ...o, live: st.phase !== 'over', ended: st.phase === 'over' }, false)}
    <div class="kd-livebody"><div class="kit-live-list">${hd}${row('A')}${row('B')}${footer}</div>
    <section class="sb-sheet-group kd-recent"><div class="kd-rhead"><b>Last 12 points</b><span class="kit-sub">oldest to newest</span></div>${recent}</section></div></div>`;
}

function screenInner(st, o) {
  if (o.live) return liveView(st, o);
  if (o.dir === 'today') return today(st, o);
  return scorer(st, o);
}

</script>
<script>
/* Prototype wiring: taps go to the engine, the engine state goes to the Kit renderers. No rules live here. */
(function () {
  var Q = new URLSearchParams(window.__QS || location.search);
  var DIRS = { b: 'B Court', a: 'A Board over pads', today: "Today's board" };
  var NAMES = { vb: 'Volleyball', bd: 'Badminton', tt: 'Table tennis' };
  var BO = { vb: 5, bd: 3, tt: 5 };
  var ui = {
    sport: NAMES[Q.get('sport')] ? Q.get('sport') : 'vb',
    dir: DIRS[Q.get('dir')] ? Q.get('dir') : 'b',
    live: Q.get('live') === '1',
    kit: Q.get('kit') === 'light' ? 'light' : 'default',
    open: Q.get('controls') === '1',
    sheet: Q.get('sheet') || null,
    note: null,
  };
  if (Q.get('bo') === '3' || Q.get('bo') === '5') BO[ui.sport] = Number(Q.get('bo'));
  var st = fresh();
  var wantState = Q.get('state');
  if (wantState && SCRIPTS[ui.sport][wantState]) st = SCRIPTS[ui.sport][wantState]();
  if (Q.get('srv') && st.phase === 'between' && !st.between.fixed) st = reduce(st, { k: 'srv', who: Q.get('srv') });

  var root = document.documentElement, app = document.getElementById('app'), ctl = document.getElementById('ctl');
  if (Q.get('bare') === '1') {
    document.body.className = 'bare';
    root.style.setProperty('--fw', (Q.get('w') || 390) + 'px'); root.style.setProperty('--fh', (Q.get('h') || 844) + 'px');
    ctl.style.display = 'none';
  }
  var noteT = null, cd = null, cdTimer = null, cdKey = '';

  function fresh() { return newMatch(ui.sport, BO[ui.sport]); }
  function say(msg) { ui.note = msg; clearTimeout(noteT); noteT = setTimeout(function () { ui.note = null; render(); }, 2200); }

  function dispatch(ev) {
    if (!valid(st, ev)) return false;
    st = reduce(st, ev); ui.note = null; render();
    return true;
  }
  function undo() {
    if (!st.ev.length) return;
    st = replay(st.sport, st.bo, st.ev.slice(0, -1)); ui.note = null; render();
  }

  // 60 second interval timer: display only, never blocks play
  function syncTimer() {
    var p = st.prompt, key = (st.phase === 'change' || st.phase === 'interval') && p && p.interval ? st.ev.length + ':' + st.phase : '';
    if (key === cdKey) return;
    cdKey = key; clearInterval(cdTimer); cd = null;
    if (!key) return;
    cd = p.interval;
    cdTimer = setInterval(function () {
      if (cd > 0) cd--;
      var n = app.querySelector('[data-cd]'); if (n) n.textContent = cd;
      if (cd === 0) clearInterval(cdTimer);
    }, 1000);
  }

  function render() {
    syncTimer();
    app.innerHTML = screenInner(st, { dir: ui.dir, live: ui.live, kit: ui.kit, cd: cd, sheet: ui.sheet, note: ui.note });
    renderCtl();
  }

  function seg(items, cur, act, label) {
    return '<div class="kd-row"><span class="kit-sub">' + label + '</span><div class="kit-seg" style="--kit-seg-cols:' + items.length + '" role="group" aria-label="' + label + '">' +
      items.map(function (it) { return '<button type="button" data-ctl="' + act + '" data-v="' + it[0] + '" aria-pressed="' + (cur === it[0]) + '">' + it[1] + '</button>'; }).join('') + '</div></div>';
  }
  function renderCtl() {
    var summary = NAMES[ui.sport] + ' · ' + DIRS[ui.dir];
    ctl.innerHTML =
      '<div class="kd-cbar"><button type="button" class="se-ctl kd-gear" data-ctl="open" aria-expanded="' + ui.open + '">' + (ui.open ? '▴' : '▾') + ' ' + summary + '</button>' +
      '<button type="button" class="se-ctl kd-livebtn" data-ctl="live" aria-pressed="' + ui.live + '">' + (ui.live ? 'Back to scorer' : 'Live view') + '</button></div>' +
      (ui.open ? '<div class="kd-panel">' +
        seg([['vb', 'Volleyball'], ['bd', 'Badminton'], ['tt', 'Table tennis']], ui.sport, 'sport', 'Sport') +
        seg([['b', 'B Court'], ['a', 'A Board over pads'], ['today', 'Today']], ui.dir, 'dir', 'Layout') +
        seg([['default', 'Red v blue'], ['light', 'Yellow v white']], ui.kit, 'kit', 'Team colours') +
        '<button type="button" class="se-ctl" data-ctl="restart">Restart match</button></div>' : '');
  }

  // taps on the board
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    var a = b.getAttribute('data-act'), who = b.getAttribute('data-who'), v = b.getAttribute('data-v');
    if (a === 'more' || a === 'finish') { ui.sheet = a === 'more' ? 'more' : 'finish'; render(); return; }
    if (a === 'closesheet') { ui.sheet = null; render(); return; }
    if (a === 'finishgo') { ui.sheet = null; ui.note = 'Finish saves the match. Not wired in this prototype.'; say(ui.note); render(); return; }
    if (ui.live || ui.dir === 'today') return;
    if (a === 'pt') dispatch({ k: 'pt', who: who });
    else if (a === 'first') dispatch({ k: 'first', who: who });
    else if (a === 'swap') dispatch({ k: 'swap', swap: v === '1' });
    else if (a === 'resume') dispatch({ k: 'resume' });
    else if (a === 'side') dispatch({ k: 'side', swap: v === '1' });
    else if (a === 'srv') dispatch({ k: 'srv', who: who });
    else if (a === 'start') dispatch({ k: 'start' });
    else if (a === 'undo') undo();
    else if (a === 'new') { st = fresh(); ui.sheet = null; ui.note = null; render(); }
    else if (a === 'bo') { if (st.phase === 'first') { BO[ui.sport] = Number(v); st = fresh(); render(); } }
    else if (a === 'let') { say('Let: replay the rally. No point.'); render(); }
  });
  app.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('role') === 'button') { e.preventDefault(); e.target.click(); }
  });
  // controls strip
  ctl.addEventListener('click', function (e) {
    var b = e.target.closest('[data-ctl]'); if (!b) return;
    var c = b.getAttribute('data-ctl'), v = b.getAttribute('data-v');
    if (c === 'open') ui.open = !ui.open;
    else if (c === 'live') ui.live = !ui.live;
    else if (c === 'sport') { if (v !== ui.sport) { ui.sport = v; st = fresh(); } }
    else if (c === 'dir') ui.dir = v;
    else if (c === 'kit') ui.kit = v;
    else if (c === 'restart') st = fresh();
    render();
  });

  window.__proto = { get state() { return st; }, ui: ui, dispatch: dispatch, undo: undo, render: render };
  render();
})();

</script>
</body></html>
