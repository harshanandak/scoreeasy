<script>
(()=>{
 'use strict';

 const sports=[['Cricket','cricket'],['Kabaddi','kabaddi'],['Volleyball','ball'],['Badminton','racket'],['Football','football'],['Basketball','basketball']];
 let screen='home',sport='Volleyball',palette='redblue',names=['Royals','Strikers'],matchStatus='live',modal=null,returnFocus=null,bg='serve';
 const initial=()=>({points:[22,19],sets:[1,0],set:2,serve:0,last:'point '+names[0],complete:false});
 let match=initial(),history=[{...initial(),points:[21,19],last:'point '+names[1],serve:1}];
 const icon=(name)=>`<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
 const escape=(value)=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

 const colors=()=>palette==='redblue'?['#b71e34','#2854bd']:['#e7c025','#f9faf7'];
 const dots=()=>colors().map(color=>`<span class="dot" style="background:${color};border:1px solid #20282030"></span>`);
 const clone=state=>({...state,points:[...state.points],sets:[...state.sets]});
 const nav=()=>`<nav class="bottom-nav" aria-label="App navigation"><button class="nav-button" data-go="home" ${screen==='home'?'aria-current="page"':''}>${icon('home')}Home</button><button class="nav-button" data-go="play" ${screen==='play'?'aria-current="page"':''}>${icon('play')}Play</button></nav>`;
 const back=(label,step='')=>`<header class="page-header"><button class="back" data-go="${screen==='setup'?'play':'home'}" aria-label="Back to ${screen==='setup'?'sports':'home'}">${icon('back')}</button><span>${label}</span>${step?`<span class="step">${step}</span>`:''}</header>`;
 function render(){
  document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.screen===(modal==='finish'?'finish':screen))));document.querySelectorAll('[data-bg]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.bg===bg)));
  const d=dots();
  if(screen==='home')app.innerHTML=`<header class="app-header"><div class="brand"><span class="mark">${icon('ball')}</span>score easy<span style="font-size:17px;color:#73816d">.</span></div><div class="avatar" aria-label="Harsha">H</div></header><main class="main"><div class="home-intro"><div class="eyebrow">Your courtside companion</div><h1>Good game.</h1><p class="subtitle">Pick up where you left off.</p></div><div class="section-head"><h2>${matchStatus==='live'?'Pick up the match':matchStatus==='finished'?'Match finished':'Ready when you are'}</h2>${matchStatus==='live'?'<span>Today · 6:42 PM</span>':''}</div>${matchStatus==='live'?`<section class="surface resume" aria-label="Match in progress"><div class="row"><span class="muted">Volleyball · Court 2</span><span class="live">Live</span></div><div class="home-teams"><div><div class="team-label">${d[0]}${escape(names[0])}</div><div class="team-label" style="margin-top:10px">${d[1]}${escape(names[1])}</div></div><div class="home-numbers">${match.points[0]}<span>–</span>${match.points[1]}</div></div><div class="row" style="margin-bottom:16px"><span class="muted">Set ${match.set} · Sets ${match.sets.join('–')}</span><span class="muted">Best of 3</span></div><button class="btn go wide" data-go="score">Resume match ${icon('arrow')}</button></section>`:`<section class="surface empty-note"><h2>${matchStatus==='finished'?'A good one for the books.':'The court is yours.'}</h2><p class="result-line">${matchStatus==='finished'?`${escape(names[0])} ${scoreText()} ${escape(names[1])}<br>Sets ${match.sets.join('–')} · Finished`:'Choose a sport and get your next match going.'}</p><button class="btn go wide" data-go="play">Start a match ${icon('arrow')}</button></section>`}${matchStatus==='live'?'<button class="btn wide new-match" data-go="play">Start a new match <span aria-hidden="true">+</span></button>':''}<div class="surface recent"><span class="sport-icon">${icon('racket')}</span><div><strong style="font-size:13px">Evening doubles</strong><p>Badminton · 21–17, 21–18</p></div>${icon('check')}</div></main>${nav()}`;
  if(screen==='play')app.innerHTML=`${back('Play')}<main class="main play-main"><div class="eyebrow">Find your game</div><h1>Pick your game.</h1><p class="subtitle">Your sport. Your scoreboard.</p><div class="sport-grid" role="radiogroup" aria-label="Sport">${sports.map(([name,id])=>`<button class="sport" role="radio" aria-checked="${sport===name}" data-sport="${name}">${icon(id)}<strong>${name}</strong></button>`).join('')}</div></main><div class="play-footer"><button class="btn go wide" data-go="setup" ${sport!=='Volleyball'?'disabled':''}>Set up ${escape(sport)} ${icon('arrow')}</button></div>${nav()}`;
  if(screen==='setup')app.innerHTML=`${back('Volleyball','Match setup')}<main class="main"><div class="setup-title"><h1>Make it your match.</h1><p class="subtitle">Two teams. One great game.</p></div><div class="team-inputs">${names.map((n,i)=>`<label><span class="field-label">Team ${i+1}</span><span class="input-wrap">${d[i]}<input data-name="${i}" aria-label="Team ${i+1} name" value="${escape(n)}" maxlength="18" autocomplete="off"></span></label>`).join('')}</div><div class="group"><span class="field-label" id="colour-label">Team colours</span><div class="palettes" aria-labelledby="colour-label"><button class="palette" data-palette="redblue" aria-pressed="${palette==='redblue'}"><span class="swatch" style="background:#b71e34"></span><span class="swatch" style="background:#2854bd"></span>Red / blue</button><button class="palette" data-palette="yellowwhite" aria-pressed="${palette==='yellowwhite'}"><span class="swatch" style="background:#f4d243"></span><span class="swatch" style="background:#fff"></span>Yellow / white</button></div></div><div class="group"><span class="field-label">Match format</span><div class="surface rule-card"><div class="rule-row"><span>Sets</span><strong>Best of 3</strong></div><div class="rule-row"><span>Points per set</span><strong>25 · Win by 2</strong></div><div class="rule-row"><span>Deciding set</span><strong>15 · Win by 2</strong></div></div></div><p class="setup-tip">${icon('ball')}First team serves to start. Points move the serve.</p></main><div class="start-footer"><button class="btn go wide" data-action="start">Start match ${icon('arrow')}</button></div>`;
  if(screen==='score')app.innerHTML=`<header class="score-header"><div><h1>${escape(names[0])} v ${escape(names[1])}</h1><p>Volleyball · ${match.set===3?15:25} pts · win by 2</p></div><div class="row"><span class="live">${match.complete?'Ended':'Live'}</span><button class="btn defined" data-modal="finish">Finish</button></div></header><div class="score-meta"><strong>Set ${match.set}</strong><span class="meta-separator">·</span><span>Sets <strong>${match.sets.join('–')}</strong></span><span class="meta-separator">·</span><span>18:42</span></div><p class="last-action" aria-live="polite">Last: <strong>${escape(match.last)}</strong> · ${scoreText()}</p><main class="scoring-keys" aria-label="Score points">${names.map((n,i)=>`<button class="score-key ${palette==='redblue'?(i===0?'red':'blue'):(i===0?'yellow':'white')}" data-point="${i}" data-side="${i===0?'left':'right'}" aria-label="Add point to ${escape(n)}, ${match.points[i]} points${match.serve===i?', serving':''}" ${match.complete?'disabled':''}>${bg==='both'||(bg==='serve'&&match.serve===i)?'<span class="key-mark" aria-hidden="true"><svg preserveAspectRatio="xMaxYMax meet"><use href="#i-vball-mark"/></svg></span>':''}<span class="serve">${match.serve===i?'Serving':''}</span><span class="key-name">${escape(n)}</span><span class="number">${match.points[i]}</span><span class="tap">Tap +1</span></button>`).join('')}</main><footer class="score-bottom"><button class="btn defined undo" data-action="undo" ${history.length?'':'disabled'}>${icon('undo')}Undo<small>${history.length?'back to '+scoreText(history[history.length-1]):'No earlier points'}</small></button><button class="btn defined more" data-modal="more" aria-label="More match options">${icon('more')}</button></footer>`;
 }
 function go(next){closeModal(false);screen=next==='finish'?'score':next;render();if(next==='finish')openModal('finish',document.querySelector('[data-modal="finish"]'));}
 function point(team){if(match.complete)return;history.push(clone(match));match.points[team]++;match.serve=team;match.last=`point ${names[team]}`;const other=1-team,target=match.set===3?15:25;if(match.points[team]>=target&&match.points[team]-match.points[other]>=2){match.sets[team]++;if(match.sets[team]===2){match.complete=true;match.last='Match point';}else{match.set++;match.points=[0,0];match.last='New set';match.serve=(match.set-1)%2;}}render();app.querySelector('[data-point="'+team+'"]')?.focus();if(match.complete)openModal('finish');}
 function closeModal(restore=true){if(!modal)return;modal=null;overlay.innerHTML='';app.inert=false;document.querySelector('.toolbar').inert=false;render();if(restore&&returnFocus){const target=returnFocus==='more'?'[data-modal="more"]':'[data-modal="finish"]';app.querySelector(target)?.focus();}}
 function openModal(kind,trigger){modal=kind;returnFocus=trigger?.dataset.modal||'finish';app.inert=true;document.querySelector('.toolbar').inert=true;let title,body,actions;
  if(kind==='more'){title='Match options';body='Keep the match moving, or take a moment before the next point.';actions=`<button class="btn wide" data-action="colours">Switch to ${palette==='redblue'?'yellow / white':'red / blue'}</button><button class="btn ink wide" data-modal="finish">Finish match</button><button class="btn wide" data-action="cancel">Back to scoring</button><button class="btn wide" data-action="home">Return home</button>`;}
  else if(kind==='discard'){title='Discard this match?';body='The score and all points in this match will be removed. This cannot be undone.';actions='<button class="btn danger wide" data-action="discard">Discard match</button><button class="btn wide" data-action="cancel">Cancel</button>';}
  else{title='Finish this match?';body='End scoring and keep this result. You can also cancel and carry on playing.';actions='<button class="btn ink wide" data-action="finish">Finish & keep result</button><button class="btn wide" data-action="cancel">Cancel</button><button class="btn danger wide" data-modal="discard">Discard match…</button>';}
  overlay.innerHTML=`<div class="modal-layer"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-copy" tabindex="-1"><div class="dialog-icon">${icon(kind==='discard'?'undo':kind==='more'?'more':'flag')}</div><h2 id="dialog-title">${title}</h2><p id="dialog-copy">${body}</p>${kind==='more'?'':`<div class="dialog-summary"><span>Set ${match.set} · Sets ${match.sets.join('–')}</span><strong>${scoreText()}</strong></div>`}<div class="dialog-actions">${actions}</div></section></div>`;overlay.querySelector('[data-action="cancel"]')?.focus();if(kind==='more')overlay.querySelector('button').focus();document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.screen==='finish'&&kind==='finish')));
 }
 document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.bg){bg=b.dataset.bg;render();return;}if(b.dataset.screen)return go(b.dataset.screen);if(b.dataset.go)return go(b.dataset.go);if(b.dataset.sport){sport=b.dataset.sport;render();app.querySelector(`[data-sport="${sport}"]`).focus();return;}if(b.dataset.palette){palette=b.dataset.palette;render();app.querySelector(`[data-palette="${palette}"]`).focus();return;}if(b.dataset.point!==undefined)return point(Number(b.dataset.point));if(b.dataset.modal)return openModal(b.dataset.modal,b);switch(b.dataset.action){case 'undo':if(history.length){match=history.pop();render();app.querySelector('[data-action="undo"]').focus();}break;case 'start':match={points:[0,0],sets:[0,0],set:1,serve:0,last:'Ready to play',complete:false};history=[];matchStatus='live';go('score');break;case 'cancel':closeModal();break;case 'colours':palette=palette==='redblue'?'yellowwhite':'redblue';closeModal();break;case 'finish':matchStatus='finished';match.complete=true;go('home');break;case 'discard':matchStatus='discarded';history=[];go('home');break;case 'home':go('home');break;}});
 document.addEventListener('input',e=>{if(e.target.dataset.name!==undefined){const i=Number(e.target.dataset.name);names[i]=e.target.value.trim()||`Team ${i+1}`;}});
 document.addEventListener('keydown',e=>{if(!modal&&e.target.matches('[data-sport]')&&['ArrowRight','ArrowLeft','ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();const index=sports.findIndex(([name])=>name===sport);sport=sports[(index+(['ArrowRight','ArrowDown'].includes(e.key)?1:5))%6][0];render();app.querySelector('[data-sport="'+sport+'"]').focus();return;}if(!modal)return;if(e.key==='Escape'){e.preventDefault();closeModal();return;}if(e.key==='Tab'){const list=[...overlay.querySelectorAll('button:not(:disabled),[tabindex="0"]')],first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
 render();
})();
</script>
</body>
</html>
