name: Android Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/android-build.yml"
      - "capacitor.config.ts"
      - "android/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.js"
  pull_request:

jobs:
  android-debug-build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Show toolchain
        run: |
          java -version
          node --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          bun --version

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run web unit tests
        run: bun run test

      - name: Check mobile web env
        env:
          USE_CI_PLACEHOLDER_ENV: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.actor == 'dependabot[bot]' }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
        run: |
          if [ "$USE_CI_PLACEHOLDER_ENV" = "true" ]; then
            echo "Skipping repository secret check for untrusted pull_request validation."
            exit 0
          fi
          test -n "$VITE_CLERK_PUBLISHABLE_KEY"
          test -n "$VITE_CONVEX_URL"

      - name: Build web bundle
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_ci_placeholder' }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL || 'https://example.invalid' }}
        run: bun run build

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build debug AAB
        working-directory: android
        run: ./gradlew bundleDebug

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
