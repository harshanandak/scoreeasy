name: iOS Build Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ios-build.yml"
      - "capacitor.config.ts"
      - "ios/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.js"

jobs:
  ios-simulator-build:
    name: Build iOS Simulator App
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks
          bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run web unit tests
        run: bun run test

      - name: Build web bundle
        run: bun run build

      - name: Sync Capacitor iOS
        run: bunx cap sync ios

      - name: List Xcode project
        run: xcodebuild -list -project ios/App/App.xcodeproj

      - name: Build iOS simulator target
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee ios-simulator-build.log

      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build-log
          path: ios-simulator-build.log
          if-no-files-found: ignore
