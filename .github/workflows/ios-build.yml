name: iOS Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/ios-build.yml"
      - "capacitor.config.ts"
      - "ios/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.js"
  pull_request:

jobs:
  ios-simulator-build:
    name: Build iOS Simulator App
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.13"

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks
          node --version
          bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run web unit tests
        run: bun run test

      - name: Check mobile web env
        env:
          USE_CI_PLACEHOLDER_ENV: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.actor == 'dependabot[bot]' }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
        run: |
          if [ "$USE_CI_PLACEHOLDER_ENV" = "true" ]; then
            echo "Skipping repository secret check for untrusted pull_request validation."
            exit 0
          fi
          test -n "$VITE_CLERK_PUBLISHABLE_KEY"
          test -n "$VITE_CONVEX_URL"

      - name: Build web bundle
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_ci_placeholder' }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL || 'https://example.invalid' }}
        run: bun run build

      - name: Sync Capacitor iOS
        run: bunx cap sync ios

      - name: List Xcode project
        run: xcodebuild -list -project ios/App/App.xcodeproj

      - name: Build iOS simulator target
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee ios-simulator-build.log

      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ios-simulator-build-log
          path: ios-simulator-build.log
          if-no-files-found: ignore
