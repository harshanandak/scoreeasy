name: iOS Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/ios-build.yml"
      - "capacitor.config.ts"
      - "ios/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.js"
  pull_request:

concurrency:
  group: ios-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator-build:
    name: Build iOS Simulator App
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.13"

      - name: Show toolchain
        id: toolchain
        run: |
          sw_vers
          xcodebuild -version
          echo "xcode-version=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"
          echo "SWIFTPM_PATH=$RUNNER_TEMP/swiftpm" >> "$GITHUB_ENV"
          xcodebuild -showsdks
          node --version
          bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run web unit tests
        run: bun run test

      - name: Check mobile web env
        env:
          USE_CI_PLACEHOLDER_ENV: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) || github.actor == 'dependabot[bot]' }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
        run: |
          if [ "$USE_CI_PLACEHOLDER_ENV" = "true" ]; then
            echo "Skipping repository secret check for untrusted pull_request validation."
            exit 0
          fi
          test -n "$VITE_CLERK_PUBLISHABLE_KEY"
          test -n "$VITE_CONVEX_URL"

      - name: Build web bundle
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_ci_placeholder' }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL || 'https://example.invalid' }}
        run: bun run build

      - name: Sync Capacitor iOS
        run: bunx cap sync ios

      - name: Cache Swift packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ env.SWIFTPM_PATH }}/Cache
            ${{ env.SWIFTPM_PATH }}/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-swiftpm-${{ steps.toolchain.outputs.xcode-version }}-${{ hashFiles('ios/**/Package.swift', 'ios/**/Package.resolved', 'bun.lock') }}

      - name: Resolve Swift packages
        run: |
          artifact_cache="$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          if [ -d "$artifact_cache" ]; then
            ls -ld "$artifact_cache"
            find "$artifact_cache" -maxdepth 1 -name '*capacitor_swift_pm*' -print
          else
            echo "Shared SwiftPM artifact cache does not exist before resolution."
          fi
          xcodebuild \
            -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath "$SWIFTPM_PATH/SourcePackages" \
            -packageCachePath "$SWIFTPM_PATH/Cache"

      - name: List Xcode project
        run: |
          xcodebuild -list -project ios/App/App.xcodeproj \
            -clonedSourcePackagesDirPath "$SWIFTPM_PATH/SourcePackages" \
            -packageCachePath "$SWIFTPM_PATH/Cache" \
            -disableAutomaticPackageResolution

      - name: Build iOS simulator target
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath "$SWIFTPM_PATH/SourcePackages" \
            -packageCachePath "$SWIFTPM_PATH/Cache" \
            -disableAutomaticPackageResolution \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee ios-simulator-build.log

      - name: Upload iOS build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-simulator-build-log
          retention-days: 7
          path: ios-simulator-build.log
          if-no-files-found: ignore
