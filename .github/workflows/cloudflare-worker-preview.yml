name: Cloudflare Worker Preview

# Per-PR preview deploy of the scoreeasy Worker via `wrangler versions upload
# --preview-alias pr-<N>` (stable URL per PR). Modeled on harshanandak/Zwapit.
#
# Previews run the DEVELOPMENT tier end-to-end so Clerk + Convex actually work on
# the preview origin: Clerk PRODUCTION keys cannot be used on *.workers.dev
# preview URLs (Clerk constraint), so previews use the Clerk DEV publishable key
# (pk_test_). Each PR gets its OWN isolated Convex backend via
# `convex deploy --preview-create pr-<N>` (CONVEX_PREVIEW_DEPLOY_KEY) — so a PR's
# new functions + schema are always present on its preview. See docs/DEPLOY.md.
#
# A single sticky PR comment (marker below) is EDITED IN PLACE through
# Queued → Building → Ready/Failed, so each push updates one comment rather than
# spamming new ones. Drafts and forked PRs are skipped (no secrets available).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

env:
  CLOUDFLARE_WORKER_NAME: scoreeasy
  CLOUDFLARE_WORKERS_SUBDOMAIN: harshananda57
  # Preview tier: Clerk DEV instance (pk_test_). VITE_CONVEX_URL is injected per-PR
  # by `convex deploy --preview-create` below — each PR's frontend points at its own
  # isolated Convex backend, not a shared dev one.
  VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.PREVIEW_VITE_CLERK_PUBLISHABLE_KEY || secrets.PREVIEW_VITE_CLERK_PUBLISHABLE_KEY || vars.VITE_CLERK_PUBLISHABLE_KEY || secrets.VITE_CLERK_PUBLISHABLE_KEY }}
  VITE_SENTRY_DSN: ${{ vars.PREVIEW_VITE_SENTRY_DSN || secrets.PREVIEW_VITE_SENTRY_DSN || vars.VITE_SENTRY_DSN || secrets.VITE_SENTRY_DSN }}

concurrency:
  group: cloudflare-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Cloudflare Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Detect mode
        id: mode
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          deployable=true
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then deployable=false; fi  # fork: no secrets
          if [ "$IS_DRAFT" = "true" ]; then deployable=false; fi          # draft: skip
          echo "deployable=$deployable" >> "$GITHUB_OUTPUT"

      - name: Check credentials
        id: guard
        if: steps.mode.outputs.deployable == 'true'
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONVEX_PREVIEW_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CONVEX_PREVIEW_DEPLOY_KEY" ] && [ -n "$VITE_CLERK_PUBLISHABLE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Preview secrets (CLOUDFLARE_API_TOKEN, CONVEX_PREVIEW_DEPLOY_KEY, PREVIEW_VITE_CLERK_PUBLISHABLE_KEY) not set — skipping preview."
          fi

      - name: Skipped status (draft / fork)
        if: steps.mode.outputs.deployable != 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'success', target_url: runUrl,
              description: 'Skipped — draft or forked pull request',
              context: 'Cloudflare Preview - scoreeasy',
            });

      - name: Checkout
        if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Comment — building
        if: steps.guard.outputs.ready == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const marker = '<!-- cloudflare-preview-status -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '### ⚡ scoreeasy preview',
              '',
              '| | |',
              '| --- | --- |',
              '| **Status** | 🔧 Building… |',
              `| **Logs** | [Workflow run](${runUrl}) |`,
              '',
              '_Cloudflare Worker preview — refreshed on every push to this PR._',
            ].join('\n');
            const { owner, repo } = context.repo;
            const n = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: n, per_page: 100 });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: n, body });
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: context.payload.pull_request.head.sha,
              state: 'pending', target_url: runUrl,
              description: 'Building — uploading Cloudflare preview',
              context: 'Cloudflare Preview - scoreeasy',
            });

      - name: Setup Bun
        if: steps.guard.outputs.ready == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.guard.outputs.ready == 'true'
        run: bun install --frozen-lockfile

      - name: Type check
        if: steps.guard.outputs.ready == 'true'
        run: bun run type-check

      # Create/update an ISOLATED Convex preview deployment for this PR (its own
      # backend with this branch's functions + schema), then build the frontend
      # against it (convex injects its URL as VITE_CONVEX_URL). Eliminates
      # "function not found" from a shared dev backend lagging the branch.
      - name: Deploy Convex preview + build frontend against it
        if: steps.guard.outputs.ready == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
        run: |
          bunx convex deploy \
            --preview-create "pr-${{ github.event.pull_request.number }}" \
            --cmd-url-env-var-name VITE_CONVEX_URL \
            --cmd 'bun run build'

      - name: Upload preview version
        id: preview
        if: steps.guard.outputs.ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          alias_name="pr-${{ github.event.pull_request.number }}"
          out="$(bunx wrangler@4 versions upload \
            --preview-alias "$alias_name" \
            --tag "$alias_name" \
            --message "PR #${{ github.event.pull_request.number }} preview for ${{ github.sha }}" 2>&1 | tee /dev/stderr)"
          url="$(printf '%s\n' "$out" | grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev[^[:space:]]*' | head -n1)"
          if [ -z "$url" ]; then
            url="https://${alias_name}-${CLOUDFLARE_WORKER_NAME}.${CLOUDFLARE_WORKERS_SUBDOMAIN}.workers.dev"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment — ready
        if: success() && steps.guard.outputs.ready == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const marker = '<!-- cloudflare-preview-status -->';
            const url = ${{ toJSON(steps.preview.outputs.url) }};
            const sha = context.payload.pull_request.head.sha;
            const { owner, repo } = context.repo;
            const n = context.issue.number;
            const dep = await github.rest.repos.createDeployment({
              owner, repo, ref: sha,
              environment: `cloudflare-preview-pr-${n}`,
              transient_environment: true, production_environment: false,
              auto_merge: false, required_contexts: [],
              description: 'scoreeasy Worker PR preview',
            });
            if (dep.data && dep.data.id) {
              await github.rest.repos.createDeploymentStatus({ owner, repo, deployment_id: dep.data.id, state: 'success', environment_url: url, description: 'Cloudflare Worker preview ready' });
            }
            await github.rest.repos.createCommitStatus({ owner, repo, sha, state: 'success', target_url: url, description: 'Preview deployment ready', context: 'Cloudflare Preview - scoreeasy' });
            const body = [
              marker,
              '### ⚡ scoreeasy preview',
              '',
              '| | |',
              '| --- | --- |',
              '| **Status** | ✅ Ready |',
              `| **Preview** | ${url} |`,
              `| **Commit** | \`${sha.slice(0, 7)}\` |`,
              '',
              '_Cloudflare Worker preview (dev Clerk + isolated per-PR Convex) — refreshed on every push to this PR._',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: n, per_page: 100 });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: n, body });

      - name: Comment — failed
        if: failure() && steps.guard.outputs.ready == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const marker = '<!-- cloudflare-preview-status -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request.head.sha;
            const { owner, repo } = context.repo;
            const n = context.issue.number;
            await github.rest.repos.createCommitStatus({ owner, repo, sha, state: 'failure', target_url: runUrl, description: 'Preview deployment failed', context: 'Cloudflare Preview - scoreeasy' });
            const body = [
              marker,
              '### ⚡ scoreeasy preview',
              '',
              '| | |',
              '| --- | --- |',
              '| **Status** | ❌ Failed |',
              `| **Logs** | [Workflow run](${runUrl}) |`,
              `| **Commit** | \`${sha.slice(0, 7)}\` |`,
              '',
              '_Preview build or upload failed — see the logs._',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: n, per_page: 100 });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: n, body });
